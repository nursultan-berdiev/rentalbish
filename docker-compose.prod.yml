# Прод-стек rentalbish. Запуск на VM:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Наружу публикуется ОДИН порт (web → 8090). Перед ним стоит внешний Traefik,
# который терминирует TLS и раздаёт домен. SPA ходят в API относительным путём
# /api/v1 — один origin, без CORS.
#
# ИИ-ассистент ходит в claude-gateway по сети claude_net (её создаёт compose
# самого claude-gateway — поднимать его нужно ПЕРВЫМ).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - ./backend/.env.prod
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    # default — к своим db/redis; claude_net — чтобы ИИ ходил в claude-gateway.
    networks:
      - default
      - claude_net
    depends_on:
      - db
      - redis

  # MCP-сервер инструментов ассистента — к нему по claude_net ходит gateway.
  mcp:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.mcp.http_server:app --host 0.0.0.0 --port 9000
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - ./backend/.env.prod
    networks:
      default:
      claude_net:
        aliases:
          - rentalbish_mcp
    depends_on:
      - db

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - ./backend/.env.prod
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

  # Единый веб-вход: статика обеих SPA + reverse-proxy на api. Один порт наружу.
  web:
    build:
      context: .
      dockerfile: deploy/prod.web.Dockerfile
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  media_data:

networks:
  # Внешняя сеть шлюза claude-gateway (создаётся его docker-compose).
  claude_net:
    external: true
    name: claude_net
