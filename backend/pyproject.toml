[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
(
  /(\.git | \.venv | __pycache__ | alembic/versions)/
)
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["alembic/versions"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI использует Depends() в аргументах по умолчанию

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
