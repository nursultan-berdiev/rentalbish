upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15M;  # запас на загрузку фото товаров

    # API и документация
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /docs {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://api_upstream;
    }

    # Медиа (фото товаров)
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
        expires 7d;
    }

    # Публичный сайт / панель (React-билды подключаются в Этапе 3/5,
    # когда будет готов дизайн: сюда монтируются dist-каталоги и раздаются
    # через try_files $uri /index.html). Пока — заглушка на /docs.
    location / {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }
}
